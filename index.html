<!DOCTYPE html><html lang=ko><head>
<meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=apple-mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-status-bar-style content=black-translucent>
<title>봇 현황</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0d0e12;color:#e8e8ea;font:16px/1.5 -apple-system,system-ui,sans-serif}
#gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0d0e12;z-index:9}
#gate h2{margin:0} #gate input{background:#16181f;border:1px solid #23262f;color:#fff;padding:12px 16px;border-radius:12px;font-size:16px;width:220px;text-align:center}
#gate button{background:#5b8cff;border:0;color:#fff;padding:12px 24px;border-radius:12px;font-size:16px;font-weight:600}
#gate .err{color:#ff6b6b;font-size:14px;height:18px}
.wrap{max-width:1200px;margin:0 auto;padding:env(safe-area-inset-top) 16px 40px;display:none}
h1{font-size:22px;margin:16px 2px 2px} .ts{color:#7a7d87;font-size:13px;margin:0 2px 16px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
.card{background:#16181f;border:1px solid #23262f;border-radius:20px;padding:20px}
.card.wide{grid-column:1/-1}
.card h2{margin:0 0 6px;font-size:19px;display:flex;justify-content:space-between;align-items:center}
.badge{font-size:12px;padding:3px 11px;border-radius:20px} .badge.on{background:#3a1d1d;color:#ff6b6b} .badge.ok{background:#1d3a24;color:#4ec77a}
.sub{color:#8a8d97;font-size:13px;margin:12px 0 6px} .muted{color:#6a6d77} b{font-weight:600}
.chartbox{position:relative;height:200px} .chip{display:inline-block;background:#23262f;border-radius:9px;padding:6px 11px;margin:3px 6px 3px 0;font-size:14px}
.big{font-size:38px;font-weight:700;margin:2px 0 0}
.bar{display:flex;align-items:center;gap:9px;margin:7px 0;font-size:14px}
.blab{width:78px;flex:none;color:#c9ccd6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrack{flex:1;height:15px;background:#1e2028;border-radius:8px;overflow:hidden} .bfill{display:block;height:100%;border-radius:8px}
.bval{width:60px;flex:none;text-align:right;color:#9aa0ad}
.badge.wait{background:#3a321d;color:#ffc857} .badge.dead{background:#2a2b31;color:#9aa0ad}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0 4px}
.kpi{background:#101218;border-radius:14px;padding:10px 12px;min-width:0} .kpi .l{color:#8a8d97;font-size:12px} .kpi .v{font-size:20px;font-weight:700;overflow-wrap:anywhere}
.kpi .v small{font-size:12px;font-weight:400;color:#8a8d97}
.gaterow{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:8px 0;border-bottom:1px solid #1e2028;font-size:14px}
.gaterow .nm{font-weight:600;width:52px} .up{color:#4ec77a} .dn{color:#ff6b6b}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed} .tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid #1e2028;text-align:left;overflow-wrap:anywhere;vertical-align:top}
.tbl th{color:#8a8d97;font-weight:500;font-size:12px} .tbl .r{text-align:right}
details{background:#101218;border-radius:12px;margin:8px 0;padding:0 12px} details>summary{cursor:pointer;padding:11px 0;font-size:14px;list-style:none;display:flex;gap:8px;align-items:flex-start}
details>summary::-webkit-details-marker{display:none} details>summary:before{content:'▸';color:#6a6d77;flex:none;transition:transform .15s} details[open]>summary:before{transform:rotate(90deg)}
details .body{padding:0 0 12px;font-size:13.5px;color:#c9ccd6}
.log{font:12px/1.5 ui-monospace,Menlo,monospace;color:#9aa0ad;white-space:pre-wrap;overflow-wrap:anywhere}
.note{background:#1d2333;border-radius:12px;padding:10px 12px;font-size:13.5px;color:#c9ccd6;margin:8px 0}
.grp{margin:16px 0 4px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.st{font-size:11px;padding:2px 8px;border-radius:10px;flex:none;white-space:nowrap} .st.confirmed{background:#1d3a24;color:#4ec77a} .st.weak,.st.contextual{background:#3a321d;color:#ffc857} .st.rejected{background:#2a2b31;color:#9aa0ad}
.qa{color:#e8e8ea;margin:2px 0 8px} .step{border-left:2px solid #2a2e3a;margin:6px 0 10px 4px;padding:2px 0 2px 12px}
.step .k{color:#8a8d97;font-size:12px} .step div{margin:2px 0}
</style></head><body>
<div id=gate><h2>🔒 봇 현황</h2><input id=pw type=password placeholder=비밀번호 autocomplete=off><button onclick=unlock()>열기</button><div class=err id=err></div></div>
<div class=wrap id=wrap>
<h1>📊 봇 현황</h1><div class=ts id=ts></div>
<div class=grid>
 <div class="card wide"><h2>🇰🇷 자사주 전략 · 실전 <span class=badge id=livebadge></span></h2><div id=live></div></div>
 <div class="card wide"><h2>📄 페이퍼 1호 <span class="badge ok">그림자</span></h2><div id=paper></div></div>
 <div class="card wide"><h2>🧭 온톨로지 분석</h2><div id=onto></div></div>
 <div class=card><h2>🛡 회피 감시 · 수집</h2><div id=avoid></div></div>
 <div class=card><h2>🗂 PEAD (폐기) <span class="badge dead">10/27 정리</span></h2><div id=pead></div></div>
 <div class="card wide"><h2>🇺🇸 미장봇</h2><div class=sub>페르소나별 누적 가정수익 <span class=muted style=font-size:12px>· 범례 탭=토글, 점 탭=값</span></div>
   <div class=chartbox><canvas id=usChart></canvas></div>
   <div class=grid style="margin-top:8px"><div><div class=sub>🔥 뜨거운 뉴스 테마</div><div id=themes></div></div>
     <div><div class=sub>점수 상위 후보</div><div id=scores></div></div></div></div>
 <div class=card><h2>🪙 코인봇 (SOL 펀딩차익)</h2><div id=coinbig></div>
   <div class=sub>펀딩 연율 추이</div><div class=chartbox style=height:150px><canvas id=coinChart></canvas></div></div>
</div><div class=muted style=text-align:center;font-size:12px;margin-top:22px>다락방 봇 대시보드</div></div>

const b642buf=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function unlock(){
 const pw=document.getElementById('pw').value;const err=document.getElementById('err');err.textContent='';
 try{
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b642buf(ENC.salt),iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b642buf(ENC.iv)},key,b642buf(ENC.ct));
  const D=JSON.parse(new TextDecoder().decode(pt));
  localStorage.setItem('dashpw',pw);
  render(D);
 }catch(e){err.textContent='비밀번호가 틀렸어요';}
}
function render(D){
 document.getElementById('gate').style.display='none';document.getElementById('wrap').style.display='block';
 document.getElementById('ts').textContent='업데이트 '+D.now;
 Chart.defaults.color='#8a8d97';
 const gopt=()=>({responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},
  plugins:{legend:{labels:{usePointStyle:true,boxWidth:8,padding:14,color:'#c9ccd6'}},
   tooltip:{callbacks:{label:c=>c.dataset.label+': '+(c.parsed.y>=0?'+':'')+c.parsed.y.toFixed(2)+'%'}}},
  scales:{x:{grid:{color:'#1e2028'},ticks:{maxTicksLimit:6}},y:{grid:{color:'#1e2028'},ticks:{callback:v=>v+'%'}}}});
 new Chart(usChart,{type:'line',data:{labels:D.us.personaX,datasets:D.us.personas.map(p=>({label:p.label,data:p.data,borderColor:p.color,backgroundColor:p.color,tension:.3,borderWidth:2.5,pointRadius:2,pointHoverRadius:5}))},options:gopt()});
 const mx=Math.max(...D.us.themes.map(x=>x.n),1);
 themes.innerHTML=D.us.themes.map(t=>{const c=t.s>0?'#4ec77a':(t.s<0?'#ff6b6b':'#6a6d77');return `<div class=bar><span class=blab>${t.t}</span><span class=btrack><span class=bfill style="width:${t.n/mx*100}%;background:${c}"></span></span><span class=bval>${t.n} ${t.s>=0?'+':''}${t.s}</span></div>`}).join('');
 scores.innerHTML=D.us.scores.map(s=>`<div class=bar><span class=blab>${s.s}</span><span class=btrack><span class=bfill style="width:${s.v}%;background:#5b8cff"></span></span><span class=bval>${s.v}</span></div>`).join('');
 try{renderKR(D.krx,gopt)}catch(e){console.error(e);live.innerHTML='<div class=muted>국장 섹션 렌더 오류: '+esc(e.message)+'</div>'}
 if(D.coin.spot!=null){coinbig.innerHTML=`<div class=big>$${D.coin.spot.toFixed(2)}</div><div class=sub>${D.coin.coin} 펀딩 연율 <b style="color:${D.coin.ann>0?'#4ec77a':'#ff6b6b'}">${D.coin.ann>=0?'+':''}${D.coin.ann.toFixed(1)}%</b></div>`;}
 new Chart(coinChart,{type:'line',data:{labels:D.coin.x,datasets:[{label:'연율%',data:D.coin.hist,borderColor:'#c77dff',backgroundColor:'rgba(199,125,255,.12)',fill:true,tension:.3,borderWidth:2.5,pointRadius:0}]},options:{...gopt(),plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.y.toFixed(1)+'%'}}}}});
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const man=v=>v==null?'—':Math.round(v/1e4).toLocaleString('ko-KR')+'<small>만원</small>';
const pct=v=>v==null?'—':(v>=0?'+':'')+v.toFixed(2)+'%';
const kpi=(l,v)=>`<div class=kpi><div class=l>${l}</div><div class=v>${v}</div></div>`;

function renderKR(K,gopt){
 // ── 실전 ──
 const L=K.live,G=K.gate,lb=document.getElementById('livebadge');
 const gopen=G.open;lb.textContent=L.kill?'킬스위치':(gopen==null?'게이트 ?':(gopen?'게이트 열림':'게이트 닫힘'));lb.className='badge '+(L.kill?'on':(gopen?'ok':'wait'));
 let h='';
 const gr=g=>{if(!g)return'';const gap=(g.close/g.ma-1)*100;return `<div class=gaterow><span class=nm>${g.lab}</span><span>${g.close.toLocaleString('ko-KR')}</span><span class=muted>120일선 ${g.ma.toLocaleString('ko-KR',{maximumFractionDigits:0})}</span><b class=${g.above?'up':'dn'}>${g.above?'위':'아래'} ${pct(gap)}</b></div>`};
 h+=`<div class=sub>진입 게이트 — 코스피 <b>또는</b> 코스닥이 120일선 위면 열림 <span class=muted>(${esc((G.kospi||G.kosdaq||{}).d||'?')} 종가 기준)</span></div>`+gr(G.kospi)+gr(G.kosdaq);
 if(!L.exists){h+=`<div class=note>아직 장부 없음 — 첫 실행 대기 (다음 실행 ${esc(L.next)})</div>`;}
 else{

  h+=`<details><summary>최근 건너뜀 ${(L.skips||[]).length}건 <span class=muted>(사유 포함)</span></summary><div class=body><table class=tbl>`+(L.skips||[]).map(s=>`<tr><td style=width:18%>${esc(s.d)}</td><td>${esc(s.name)}</td><td>${esc(s.why)}</td></tr>`).join('')+`</table></div></details>`;
 }
 h+=`<details><summary>실행 로그 (최근 ${(L.log||[]).length}줄)</summary><div class="body log">${(L.log||[]).map(esc).join('\n')||'—'}</div></details>`;
 h+=`<div class=muted style=font-size:12px;margin-top:8px>규칙: 자사주 직접취득(장내)·신탁 신규, 금액 ≥ 시총 1% → 공시 다음 거래일 15:20 시장가 · 비중 5%(공시일 ≤−1% 또는 ≥2%면 10%) · 20거래일 보유, 악재 공시면 다음 거래일 청산 · 평일 15:15 실행</div>`;
 live.innerHTML=h;
 // ── 페이퍼 1호 ──
 const P=K.paper;
 if(!P.exists){paper.innerHTML='<div class=muted>shadow.db 없음</div>';}
 else{
  const ls=P.last||{};
  let q=`<div class=kpis>${kpi('NAV · '+esc(ls.d||''),man(ls.nav))}${kpi('원금 700만 대비',pct(ls.vs0))}${kpi('현금',man(ls.cash))}${kpi('보유 · 청산',(ls.n??'—')+'<small>종목 · 청산 '+P.closed.n+'건</small>')}</div>`;
  q+=`<div class=sub>NAV vs 코스피 <span class=muted>(${esc(ls.from||'')} 기록 시작=0%)</span></div><div class=chartbox><canvas id=paperChart></canvas></div>`;
  q+=`<div class=sub>보유 종목 <span class=muted>(경과=거래일, 지수 데이터 최종일 기준)</span></div><table class=tbl><tr><th>종목</th><th>진입</th><th class=r>수량</th><th class=r>경과</th></tr>`+(P.pos||[]).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.entry)} @${p.px?.toLocaleString('ko-KR')}</td><td class=r>${p.qty}주</td><td class=r>${p.held??'?'}/20일</td></tr>`).join('')+`</table>`;
  q+=`<div class=sub>대기 신호</div>`+((P.pending||[]).map(p=>`<span class=chip>${esc(p.name)} <span class=muted>공시 ${esc(p.sig)}</span></span>`).join('')||'<span class=muted>—</span>');
  q+=`<details><summary>최근 건너뜀 ${(P.skips||[]).length}건 <span class=muted>(사유 포함)</span></summary><div class=body><table class=tbl>`+(P.skips||[]).map(s=>`<tr><td style=width:18%>${esc(s.d)}</td><td>${esc(s.name)}</td><td>${esc(s.why)}</td></tr>`).join('')+`</table></div></details>`;
  paper.innerHTML=q;
  new Chart(paperChart,{type:'line',data:{labels:P.x,datasets:[{label:'페이퍼 1호',data:P.nav,borderColor:'#5b8cff',backgroundColor:'#5b8cff',tension:.25,borderWidth:2.5,pointRadius:3,pointHoverRadius:6},{label:'코스피',data:P.kospi,borderColor:'#8a8d97',backgroundColor:'#8a8d97',borderDash:[5,4],tension:.25,borderWidth:2,pointRadius:3,pointHoverRadius:6}]},options:gopt()});
 }
 // ── 온톨로지 ──
 const O=K.onto;
 if(!O||O.err){onto.innerHTML='<div class=muted>ontology.json 읽기 실패 '+esc(O&&O.err)+'</div>';}
 else{
  const GRP=[['buy','✅ 유효 — 매수 규칙에 씀'],['avoid','⛔ 유효 — 회피·매도 신호'],['weak','🟡 약함 — 신호로는 부족'],['no','✖️ 무효 — 데이터가 부정']];
  let o=`<div class=sub>${esc(O.name)} v${esc(O.ver)} · ${esc(O.upd)} · ${esc(O.owner)} · 질문 ${O.qs.length}문항 <span class=muted>· 항목을 누르면 근거 경로(질문 → 데이터 → 결과)</span></div>`;
  o+=`<div class=note><b>살 때</b> ${esc(O.buy)}<br><b>팔 때</b> ${esc(O.sell)}</div>`;
  for(const [g,lab] of GRP){const qs=O.qs.filter(x=>x.g===g);if(!qs.length)continue;
   o+=`<div class=grp>${lab} <span class=muted style=font-weight:400;font-size:13px>${qs.length}</span></div>`;
   o+=qs.map(x=>`<details><summary><span style=flex:1><b>Q. ${esc(x.q)}</b><div class=qa>${esc(x.a)}</div></span></summary><div class=body>`+x.path.map(s=>`<div class=step><div><span class="st ${s.sk}">${STL[s.sk]||''}</span> <span class=k>원문 상태: ${esc(s.st)}</span></div><div><span class=k>질문 → 사건</span> <b>${esc(s.ev)}</b>${s.cond?` <span class=muted>[${esc(s.cond)}]</span>`:''} → ${esc(s.out)}</div><div><span class=k>데이터</span> ${s.n?'n='+Number(s.n).toLocaleString('ko-KR')+' · ':''}${esc(s.win)} · ${esc(s.src)}</div><div><span class=k>결과</span> ${esc(s.eff)}</div>${s.ver?`<div class=k>최종 검증 ${esc(s.ver)}</div>`:''}</div>`).join('')+`</div></details>`).join('');
  }
  o+=`<details><summary>결정론적 규칙 ${O.rules.length}개 (그림자 1호와 1:1)</summary><div class=body>${O.rules.map(r=>'· '+esc(r)).join('<br>')}</div></details>`;
  o+=(O.strat||[]).map(s=>`<details><summary>${esc(s.label)} 백테스트</summary><div class=body>${esc(s.bt)}<br><span class=muted>주의: ${esc(s.cav)}</span></div></details>`).join('');
  o+=`<details><summary>측정 방법</summary><div class=body>${esc(O.measure)}</div></details>`;
  onto.innerHTML=o;
 }
 // ── 회피 감시 · 수집 ──
 const A=K.avoid||{};
 avoid.innerHTML=`<div class=kpis>${kpi('회피 공시 누적',(A.n??'—')+'<small>건</small>')}${kpi('보유 종목 해당',(A.held??'—')+'<small>건</small>')}</div><div class=sub>최근 회피 공시 <span class=muted>(30일 매수차단 대상)</span></div>`+((A.recent||[]).map(r=>`<div class=bar><span class=muted style=width:44px;flex:none>${esc(r.d)}</span><span style=flex:1;min-width:0>${esc(r.name)}</span><span class=chip style=margin:0>${esc(r.et)}</span></div>`).join('')||'<span class=muted>—</span>')+`<div class=sub>일일 수집</div><div style=font-size:14px>${esc(K.daily||'—')}</div><div class=muted style=font-size:12px;margin-top:6px>수집 19:40 · 회피 19:50 · 페이퍼 19:55</div>`;
 // ── PEAD ──
 const PD=K.pead||{};
 pead.innerHTML=`<div class=note>PEAD 전략은 폐기됐습니다. 남은 종목은 <b>10/27(화) 09:01</b> 시장가 전량 정리 예정(liquidate_pead.py).</div>`+(PD.left?`<div class=sub>남은 종목 (${esc(PD.asof)} 점검)</div>`+PD.left.map(n=>`<span class=chip>${esc(n)}</span>`).join(''):'')+((PD.log||[]).length?`<div class=sub>정리 로그</div><div class=log>${PD.log.map(esc).join('\n')}</div>`:`<div class=muted style=font-size:13px;margin-top:8px>정리 로그 아직 없음</div>`);
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
const saved=localStorage.getItem('dashpw');if(saved){document.getElementById('pw').value=saved;unlock();}
window.unlock=unlock;
</script></body></html>
